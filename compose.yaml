services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      CONFIG_PATH: /app/config/bot.json
      STATE_PATH: /app/data/state.json
      NODE_ENV: production
    volumes:
      - ./config:/app/config
      - bot-state:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  bot-state:
